name: unmess

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    profiles: ["app"]
    image: unmess-app:local
    env_file: &app-env
      - path: .env.example
      - path: .env
        required: false
    command: ["uvicorn", "unmess.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on: [qdrant, redis]

  worker:
    profiles: ["app"]
    image: unmess-app:local
    env_file: *app-env
    command: ["arq", "unmess.workers.arq_worker.WorkerSettings"]
    depends_on: [qdrant, redis]

  ui:
    profiles: ["app"]
    image: unmess-app:local
    env_file: *app-env
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    depends_on: [api]

volumes:
  qdrant-data:
  redis-data:
